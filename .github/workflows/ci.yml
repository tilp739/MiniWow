name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MiniWow.Backend.sln

      - name: Build
        run: dotnet build MiniWow.Backend.sln -c Release --no-restore

      - name: Test
        run: dotnet test MiniWow.Backend.sln -c Release --no-build --logger "trx"
